name: Build Eldoria macOS PKG

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-macos-pkg:
    # macos-latest é utilizado conforme solicitado.
    # O script força a arquitetura x86_64 para o iMac 2011.
    runs-on: macos-latest

    env:
      SOURCE_URL: https://files.manuscdn.com/user_upload_by_module/session_file/310419663029620662/wswDbHpyEdMDJdkA.zip
      SOURCE_SHA256: 1bffa22cdf6af1f85d250132f2eb79492f21f10a7b9aaca295fcf1ef38bc8264
      MACOSX_DEPLOYMENT_TARGET: "10.13"

    steps:
      - name: Preparar diretórios
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/download" "$GITHUB_WORKSPACE/source"

      - name: Baixar source da CDN
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --show-error --silent \
            --retry 5 \
            --retry-delay 5 \
            --output "$GITHUB_WORKSPACE/download/Eldoria-Source-Complete.zip" \
            "$SOURCE_URL"

      - name: Validar integridade do ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/download"
          echo "$SOURCE_SHA256  Eldoria-Source-Complete.zip" | shasum --algorithm 256 --check

      - name: Extrair source
        shell: bash
        run: |
          set -euo pipefail
          unzip -q \
            "$GITHUB_WORKSPACE/download/Eldoria-Source-Complete.zip" \
            -d "$GITHUB_WORKSPACE/source"

      - name: Localizar script de build macOS
        shell: bash
        run: |
          set -euo pipefail

          BUILD_SCRIPT="$(find "$GITHUB_WORKSPACE/source" \
            -type f \
            -path '*/native/packaging/macos/build-macos-10.13.sh' \
            -print -quit )"

          if [[ -z "$BUILD_SCRIPT" ]]; then
            echo "Erro: build-macos-10.13.sh não foi encontrado no ZIP." >&2
            exit 1
          fi

          NATIVE_ROOT="${BUILD_SCRIPT%/packaging/macos/build-macos-10.13.sh}"

          echo "BUILD_SCRIPT=$BUILD_SCRIPT" >> "$GITHUB_ENV"
          echo "NATIVE_ROOT=$NATIVE_ROOT" >> "$GITHUB_ENV"

          chmod +x "$BUILD_SCRIPT"

          echo "Script encontrado em: $BUILD_SCRIPT"
          echo "Raiz native encontrada em: $NATIVE_ROOT"

      - name: Compilar Eldoria e criar PKG
        shell: bash
        run: |
          set -euo pipefail
          "$BUILD_SCRIPT" --pkg

      - name: Verificar instalador PKG
        shell: bash
        run: |
          set -euo pipefail

          PKG_PATH="$NATIVE_ROOT/dist/macos/Eldoria-macOS-10.13.pkg"

          if [[ ! -f "$PKG_PATH" ]]; then
            echo "Erro: o instalador PKG não foi criado em: $PKG_PATH" >&2
            find "$NATIVE_ROOT/dist" -maxdepth 4 -type f -print 2>/dev/null || true
            exit 1
          fi

          file "$PKG_PATH"
          shasum --algorithm 256 "$PKG_PATH" | tee "$PKG_PATH.sha256"
          echo "PKG_PATH=$PKG_PATH" >> "$GITHUB_ENV"

      - name: Publicar instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Eldoria-macOS-10.13-pkg
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ env.PKG_PATH }}
            ${{ env.PKG_PATH }}.sha256
