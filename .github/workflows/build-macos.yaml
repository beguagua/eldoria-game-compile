name: Build Eldoria macOS PKG

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-macos-pkg:
    name: Compilar Eldoria macOS 10.13+ Intel
    # Intel é necessário porque o pacote será destinado ao iMac 2011.
    runs-on: macos-15-intel

    env:
      SOURCE_URL: https://files.manuscdn.com/user_upload_by_module/session_file/310419663029620662/odnNufstxYplwKni.zip
      SOURCE_SHA256: f85c3e0248fbd084e8e60050ffa018837d93082e5f097572d717145dbeab3f72
      MACOSX_DEPLOYMENT_TARGET: "10.13"

    steps:
      - name: Preparar diretórios
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/download" "$GITHUB_WORKSPACE/source"

      - name: Baixar source corrigido da CDN
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --show-error --silent \
            --retry 5 \
            --retry-delay 5 \
            --output "$GITHUB_WORKSPACE/download/Eldoria-Source-Complete.zip" \
            "$SOURCE_URL"

      - name: Validar SHA-256 do source
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/download"
          echo "$SOURCE_SHA256  Eldoria-Source-Complete.zip" | shasum -a 256 -c -

      - name: Extrair source
        shell: bash
        run: |
          set -euo pipefail
          unzip -q \
            "$GITHUB_WORKSPACE/download/Eldoria-Source-Complete.zip" \
            -d "$GITHUB_WORKSPACE/source"

      - name: Localizar script de compilação
        shell: bash
        run: |
          set -euo pipefail

          BUILD_SCRIPT="$(find "$GITHUB_WORKSPACE/source" \
            -type f \
            -path '*/native/packaging/macos/build-macos-10.13.sh' \
            -print -quit )"

          if [[ -z "$BUILD_SCRIPT" ]]; then
            echo "Erro: script build-macos-10.13.sh não encontrado no ZIP." >&2
            exit 1
          fi

          NATIVE_ROOT="${BUILD_SCRIPT%/packaging/macos/build-macos-10.13.sh}"

          chmod +x \
            "$BUILD_SCRIPT" \
            "$NATIVE_ROOT/packaging/macos/build-pkg.sh"

          echo "BUILD_SCRIPT=$BUILD_SCRIPT" >> "$GITHUB_ENV"
          echo "NATIVE_ROOT=$NATIVE_ROOT" >> "$GITHUB_ENV"

          echo "Script: $BUILD_SCRIPT"
          echo "Diretório native: $NATIVE_ROOT"

      - name: Compilar raylib, Eldoria e criar PKG
        shell: bash
        run: |
          set -euo pipefail
          "$BUILD_SCRIPT" --pkg

      - name: Verificar instalador PKG
        shell: bash
        run: |
          set -euo pipefail

          PKG_PATH="$NATIVE_ROOT/dist/macos/Eldoria-macOS-10.13.pkg"

          if [[ ! -f "$PKG_PATH" ]]; then
            echo "Erro: o instalador PKG não foi criado." >&2
            find "$NATIVE_ROOT/dist" -maxdepth 4 -type f -print 2>/dev/null || true
            exit 1
          fi

          file "$PKG_PATH"
          shasum -a 256 "$PKG_PATH" | tee "$PKG_PATH.sha256"

          echo "PKG_PATH=$PKG_PATH" >> "$GITHUB_ENV"

      - name: Publicar PKG como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Eldoria-macOS-10.13-pkg
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ env.PKG_PATH }}
            ${{ env.PKG_PATH }}.sha256
