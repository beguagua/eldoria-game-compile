name: Build Eldoria Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "native/**"

permissions:
  contents: read

jobs:
  android:
    name: Gerar APK e AAB do Eldoria
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK, NDK e CMake
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;26.3.11579264"

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar APK e AAB
        working-directory: native/android
        env:
          ANDROID_NDK_VERSION: 26.3.11579264
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon clean assembleRelease bundleRelease \
            -Pandroid.ndkVersion="$ANDROID_NDK_VERSION"

      - name: Verificar artefatos
        shell: bash
        run: |
          set -euo pipefail

          test -f native/android/app/build/outputs/apk/release/app-release.apk
          test -f native/android/app/build/outputs/bundle/release/app-release.aab

          sha256sum \
            native/android/app/build/outputs/apk/release/app-release.apk \
            native/android/app/build/outputs/bundle/release/app-release.aab

      - name: Publicar APK e AAB
        uses: actions/upload-artifact@v4
        with:
          name: Eldoria-Android-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            native/android/app/build/outputs/apk/release/app-release.apk
            native/android/app/build/outputs/bundle/release/app-release.aab
            
