name: Eldoria Commercial Builds

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows:
    name: Windows portable + installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '3.1.x'
      - name: Build portable Windows
        run: dotnet publish Eldoria/Eldoria.csproj -c Release -r win-x64 --self-contained true -o build/windows
      - name: Zip portable Windows
        shell: pwsh
        run: Compress-Archive -Path build/windows/* -DestinationPath Eldoria-Windows-Portable.zip
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: '& "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" "installer\windows\Eldoria.iss"'
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: Eldoria-Windows
          path: |
            Eldoria-Windows-Portable.zip
            installer/windows/installer-output/Eldoria-Windows-Installer.exe

  macos:
    name: macOS Intel 10.13 portable + installer
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '3.1.x'
      - name: Build macOS Intel
        run: dotnet publish Eldoria/Eldoria.csproj -c Release -r osx-x64 --self-contained true -o build/macos
      - name: Create portable app
        run: |
          mkdir -p Eldoria.app/Contents/MacOS Eldoria.app/Contents/Resources
          cp build/macos/Eldoria Eldoria.app/Contents/MacOS/Eldoria
          chmod +x Eldoria.app/Contents/MacOS/Eldoria
          cat > Eldoria.app/Contents/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleName</key><string>Eldoria</string>
          <key>CFBundleDisplayName</key><string>Eldoria</string>
          <key>CFBundleIdentifier</key><string>com.eldoria.game</string>
          <key>CFBundleVersion</key><string>0.1.0</string>
          <key>CFBundleExecutable</key><string>Eldoria</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          </dict></plist>
          EOF
      - name: Create portable macOS ZIP
        run: zip -r Eldoria-macOS-10.13-Portable.zip Eldoria.app
      - name: Create macOS installer package
        run: pkgbuild --root Eldoria.app --identifier com.eldoria.game --version 0.1.0 Eldoria-macOS-10.13-Installer.pkg
      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: Eldoria-macOS-Intel
          path: |
            Eldoria-macOS-10.13-Portable.zip
            Eldoria-macOS-10.13-Installer.pkg

  source:
    name: Source code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: zip -r Eldoria-Source.zip Eldoria installer .github
      - uses: actions/upload-artifact@v4
        with:
          name: Eldoria-Source
          path: Eldoria-Source.zip
