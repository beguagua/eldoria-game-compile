plugins {
    id 'com.android.application'
}

android {
    namespace 'com.raycastcorp.eldoria'
    compileSdk 35
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'com.raycastcorp.eldoria'
        minSdk 23
        targetSdk 35
        versionCode 15
        versionName '0.1.5'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DPLATFORM=Android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            // Assinatura debug apenas para gerar um APK instalável localmente.
            // Para Google Play, substitua por um keystore de release próprio.
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}
